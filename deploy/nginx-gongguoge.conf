# 功过格后端 Nginx 反向代理配置
#
# 用法：把本文件放到 /etc/nginx/conf.d/gongguoge.conf 后执行
#   nginx -t && systemctl reload nginx
#
# 两种用法二选一：
#   A. 有域名 + HTTPS（推荐，正式上线用）——用下面第一段 server 块
#   B. 只有公网 IP、暂时用 HTTP ——用第二段 server 块
# 把 api.example.com 换成你自己的域名，把 IP 换成你的公网 IP。

# ============ A. HTTPS（有域名时用这段）============
server {
    listen 80;
    server_name api.example.com;
    # HTTP 自动跳 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # 证书路径（用 certbot 申请后会自动生成，见 DEPLOY.md）
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 头像等上传文件可能较大，放宽请求体上限（后端限制 2MB，这里给足余量）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 让后端能拿到真实客户端 IP 与协议
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 离线同步是短请求，超时不用给太长
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# ============ B. 只有公网 IP、用 HTTP（先用这段把服务跑通）============
# 注意：用这段时 Nginx 监听 80，外网访问 http://你的公网IP
# 前端 config.js 也要相应写 http://你的公网IP（不要带端口）
